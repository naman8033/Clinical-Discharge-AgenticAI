# =============================================================================
#  LiteLLM Gateway Configuration
#  Agentic Discharge AI — Model Routing & Cost Control via OmniRouter
# =============================================================================

model_list:
  # ── Primary: OmniRouter (Local Proxy on :20128) ───────────────────────────
  - model_name: gpt-5.4-mini          # Virtual alias used by agents
    litellm_params:
      model: openai/vertex/gemini-2.0-flash
      api_base: "http://localhost:20128/v1"
      api_key: "os.environ/OMNIROUTER_API_KEY"
      max_tokens: 8192

  - model_name: vertex/gemini-2.0-flash
    litellm_params:
      model: openai/vertex/gemini-2.0-flash
      api_base: "http://localhost:20128/v1"
      api_key: "os.environ/OMNIROUTER_API_KEY"
      max_tokens: 8192

  - model_name: gpt-5.4-turbo         # Clinical-grade / reasoning alias
    litellm_params:
      model: openai/vertex/gemini-2.5-flash
      api_base: "http://localhost:20128/v1"
      api_key: "os.environ/OMNIROUTER_API_KEY"
      max_tokens: 8192

  - model_name: text-embedding-3-small # Embeddings alias mapped to OmniRouter
    litellm_params:
      model: openai/gemini/gemini-embedding-001
      api_base: "http://localhost:20128/v1"
      api_key: "os.environ/OMNIROUTER_API_KEY"

# =============================================================================
#  Router settings
# =============================================================================
router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 30

# =============================================================================
#  General settings
# =============================================================================
general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false

# =============================================================================
#  Logging & Observability
# =============================================================================
litellm_settings:
  set_verbose: false
  drop_params: true
  request_timeout: 120
